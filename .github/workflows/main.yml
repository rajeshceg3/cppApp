name: C++ offline verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check required verification programs
        run: command -v g++ && command -v python3 && command -v nm && command -v readelf && command -v strace
      - name: Build and verify with no production transport
        run: make verify
      - name: Verify CMake safe default
        run: |
          cmake -S . -B build-cmake
          cmake --build build-cmake
          python3 tests/verify_offline.py build-cmake/sms_app_offline
